<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aulas - Unifaat Frontend 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f7f3;
            --bg-raised: #e7ebe4;
            --bg-chrome: #12211c;
            --ink: #1b231e;
            --muted: #545f57;
            --muted-2: #808c83;
            --accent: #935a00;
            --accent-ink: #fff6e8;
            --accent-2: #0d7a5f;
            --rule: #d7ddd2;
            --shadow: rgba(30,40,32,.14);
            --font-body: 'IBM Plex Sans', system-ui, sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            margin: 0;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1220px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: clamp(2rem, 4vw, 3.5rem);
            line-height: 1.05;
            letter-spacing: -0.01em;
            margin: 0 0 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--muted);
            margin: 0 0 3rem;
            font-family: var(--font-body);
        }

        .aulas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .aula-card {
            background: var(--bg-raised);
            border: 1px solid var(--rule);
            border-radius: 4px;
            padding: 2rem;
            text-decoration: none;
            color: var(--ink);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
            cursor: pointer;
        }

        .aula-card:hover {
            background: var(--bg-chrome);
            color: var(--accent-ink);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .aula-numero {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-2);
            margin-bottom: 0.5rem;
        }

        .aula-card:hover .aula-numero {
            color: var(--accent);
        }

        .aula-titulo {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            line-height: 1.2;
        }

        .aula-descricao {
            font-size: 0.95rem;
            color: var(--muted);
            flex-grow: 1;
        }

        .aula-card:hover .aula-descricao {
            color: var(--muted-2);
        }

        .aula-arrow {
            margin-top: 1rem;
            font-size: 1.5rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .aula-card:hover .aula-arrow {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 3rem 2rem;
            font-size: 1.1rem;
        }

        .footer {
            text-align: center;
            color: var(--muted-2);
            font-size: 0.9rem;
            border-top: 1px solid var(--rule);
            padding-top: 2rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aulas</h1>
        <p class="subtitle">Unifaat Frontend 2026 — Bimestre 01</p>

        <div class="aulas-grid" id="aulasContainer"></div>

        <div class="footer">
            Desenvolvido por Luan Tavares para UNIFAAT
        </div>
    </div>

    <script>
        const aulas = [
            {
                numero: '04',
                titulo: 'Navegadores Web e API',
                descricao: 'Entendimento de navegadores web, introdução a APIs e integração com dados remotos.',
                link: './04/'
            },
            {
                numero: '05',
                titulo: 'TypeScript, Generics e API Contextual',
                descricao: 'Tipagem para escalar, generics reutilizáveis, pré compilação com Vite e eliminação de redundância nas APIs.',
                link: './05/'
            }
        ];

        const container = document.getElementById('aulasContainer');

        if (aulas.length === 0) {
            container.innerHTML = '<div class="empty-state">Nenhuma aula disponível no momento.</div>';
        } else {
            aulas.forEach(aula => {
                const card = document.createElement('a');
                card.href = aula.link;
                card.className = 'aula-card';
                card.innerHTML = `
                    <div>
                        <div class="aula-numero">Aula ${aula.numero}</div>
                        <div class="aula-titulo">${aula.titulo}</div>
                        <div class="aula-descricao">${aula.descricao}</div>
                    </div>
                    <div class="aula-arrow">→</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
